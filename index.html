<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUR$ - Finanzas</title>
    
    <!-- Fuentes: Inter para ese look moderno y bold -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN para no requerir instalación) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js para los gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        darkBg: '#050505',
                        cardBg: '#121212',
                        accent: '#ffffff'
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Ocultar scrollbar para un look más limpio */
        ::-webkit-scrollbar { display: none; }
        body { background-color: #050505; color: white; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center p-4 sm:p-8">

    <!-- App Container -->
    <div class="w-full max-w-md mx-auto flex flex-col gap-8">
        
        <!-- Header -->
        <header class="flex justify-between items-center pt-4">
            <h1 class="text-3xl font-black tracking-tighter">OUR$</h1>
            <div class="w-10 h-10 bg-cardBg rounded-full flex items-center justify-center border border-neutral-800 shadow-lg">
                <span class="text-sm font-bold">👤</span>
            </div>
        </header>

        <!-- Navegación de Pestañas -->
        <nav class="flex justify-between bg-cardBg p-1.5 rounded-full border border-neutral-800">
            <button onclick="switchTab('mia')" id="tab-mia" class="w-1/3 py-2 text-sm font-bold rounded-full bg-white text-black transition-all">Mía</button>
            <button onclick="switchTab('pareja')" id="tab-pareja" class="w-1/3 py-2 text-sm font-bold rounded-full text-neutral-400 transition-all">Pareja</button>
            <button onclick="switchTab('conjunta')" id="tab-conjunta" class="w-1/3 py-2 text-sm font-bold rounded-full text-neutral-400 transition-all">Conjunta</button>
        </nav>

        <!-- Dashboard / Balance Total -->
        <section class="flex flex-col items-center justify-center py-6 bg-cardBg rounded-[2rem] border border-neutral-800">
            <p class="text-neutral-400 text-sm font-bold uppercase tracking-widest mb-2" id="dashboard-title">Balance Actual</p>
            <h2 class="text-5xl font-black tracking-tighter" id="total-balance">€1,240.50</h2>
            <button onclick="connectBank()" class="mt-6 px-6 py-2 border border-neutral-700 rounded-full text-xs font-bold uppercase tracking-wide hover:bg-white hover:text-black transition-colors">
                + Sincronizar Banco
            </button>
        </section>

        <!-- Gráfico de Gastos -->
        <section class="bg-cardBg p-6 rounded-[2rem] border border-neutral-800">
            <h3 class="font-bold mb-4">Análisis de Gastos</h3>
            <canvas id="expensesChart" height="200"></canvas>
        </section>

        <!-- Contenedor vacío donde Firebase cargará los datos -->
        <section id="lista-transacciones" class="flex flex-col gap-4 mb-20"></section>

    </div>

    <!-- Botón Flotante para añadir efectivo -->
    <button onclick="alert('Añadir gasto manual')" class="fixed bottom-8 right-8 w-16 h-16 bg-white text-black rounded-full flex items-center justify-center text-3xl shadow-[0_0_20px_rgba(255,255,255,0.2)] hover:scale-105 transition-transform z-50">
        +
    </button>

    <!-- Scripts de Lógica -->
    <!-- Módulo de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Tus credenciales
        const firebaseConfig = {
            apiKey: "AIzaSyClKGn0OBZYbCWUJ0MLRHe7-Td48vS0Z6E",
            authDomain: "gestion-gastos-e33d3.firebaseapp.com",
            projectId: "gestion-gastos-e33d3",
            storageBucket: "gestion-gastos-e33d3.firebasestorage.app",
            messagingSenderId: "62997152521",
            appId: "1:62997152521:web:6502409ba7a7079d0549d8",
            measurementId: "G-HRB3FPLS83"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        console.log("🔥 Firebase conectado con éxito");
// 1. Diccionario de Categorías (Aquí configuras los iconos)
        const categoriasUI = {
            "Compra": { emoji: "🛒", color: "text-red-400" },
            "Comida": { emoji: "🍣", color: "text-red-400" },
            "Ocio": { emoji: "🍿", color: "text-red-400" },
            "Salud": { emoji: "💊", color: "text-red-400" },
            "Alquiler": { emoji: "🏠", color: "text-red-400" },
            "Ingreso": { emoji: "💰", color: "text-green-400" },
            "default": { emoji: "💸", color: "text-neutral-400" } // Si viene una categoría nueva
        };

        // 2. Función para leer de Firebase y pintar en pantalla
        async function cargarGastos() {
            const contenedor = document.getElementById('lista-transacciones');
            contenedor.innerHTML = '<h3 class="font-bold">Cargando gastos...</h3>'; // Mensaje temporal

            try {
                // Va a Firebase a pedir los documentos de la colección "transacciones"
                const respuesta = await getDocs(collection(db, "transacciones"));
                
                // Limpiamos y ponemos el título definitivo
                contenedor.innerHTML = '<h3 class="font-bold">Recientes</h3>'; 

                // Por cada gasto que encuentre, crea la cajita HTML
                respuesta.forEach((documento) => {
                    const datos = documento.data();
                    
                    // Busca la categoría. Si no la encuentra, usa la de por defecto ("default")
                    const estilo = categoriasUI[datos.categoria] || categoriasUI["default"];

                    const gastoHTML = `
                    <div class="flex items-center justify-between bg-cardBg p-4 rounded-3xl border border-neutral-800 mb-2">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-neutral-900 rounded-full flex items-center justify-center text-xl">${estilo.emoji}</div>
                            <div>
                                <p class="font-bold text-white">${datos.titulo}</p>
                                <p class="text-xs text-neutral-500 font-medium">${datos.categoria}</p>
                            </div>
                        </div>
                        <p class="font-bold ${estilo.color}">${datos.cantidad}€</p>
                    </div>
                    `;
                    // Añade la cajita a la web
                    contenedor.innerHTML += gastoHTML;
                });
            } catch (error) {
                console.error("Error al cargar de Firebase:", error);
                contenedor.innerHTML = '<p class="text-red-500">Error cargando los datos.</p>';
            }
        }

        // Ejecutar la función nada más abrir la web
        cargarGastos();
    </script>

    <!-- Lógica de la UI (Pestañas y Gráficos) -->
    <script>
        // Lógica de Pestañas
        function switchTab(tabId) {
            const tabs = ['mia', 'pareja', 'conjunta'];
            
            tabs.forEach(t => {
                const element = document.getElementById(`tab-${t}`);
                if(t === tabId) {
                    element.classList.add('bg-white', 'text-black');
                    element.classList.remove('text-neutral-400');
                } else {
                    element.classList.remove('bg-white', 'text-black');
                    element.classList.add('text-neutral-400');
                }
            });

            // Cambiar datos ficticios según pestaña
            const balanceEl = document.getElementById('total-balance');
            if(tabId === 'mia') balanceEl.innerText = '€1,240.50';
            if(tabId === 'pareja') balanceEl.innerText = '€980.00';
            if(tabId === 'conjunta') balanceEl.innerText = '€2,220.50';
        }

       // Conexión real con el Backend en Vercel
        async function connectBank() {
            const btn = event.target;
            btn.innerText = "Cargando...";
            
            try {
                // Llamamos a nuestra función secreta de Vercel
                const response = await fetch('/api/connect');
                const result = await response.json();
                
                // Redirigimos al usuario a la web segura de Salt Edge para que elija su banco
                if (result.data && result.data.connect_url) {
                    window.location.href = result.data.connect_url;
                } else {
                    alert("Error al conectar con el banco");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un problema con la conexión");
            } finally {
                btn.innerText = "+ Sincronizar Banco";
            }
        }

        // Gráfico con Chart.js
        const ctx = document.getElementById('expensesChart').getContext('2d');
        Chart.defaults.color = '#737373';
        Chart.defaults.font.family = 'Inter';
        
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Comida', 'Salud', 'Ocio', 'Alquiler'],
                datasets: [{
                    data: [30, 15, 20, 35],
                    backgroundColor: ['#ffffff', '#a3a3a3', '#525252', '#262626'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                cutout: '80%',
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 20, font: { weight: 'bold' } } }
                }
            }
        });
    </script>
</body>
</html>
